[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mysuite"
version = "0.1.0"
description = "A free, local CLI + terminal-dashboard toolkit for image and design-asset work: export, convert, cutout, watermark, metadata privacy, compression."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=2.0",
    "tomlkit>=0.13",
    "pillow",
    "numpy>=1.24",
    "pypdf>=4",
]

[project.optional-dependencies]
# Optional neural backend for `mysuite enhance` (Real-ESRGAN upscaling + GFPGAN faces).
# Also needs model weights in ~/.cache/mysuite/models — see README.
ai = [
    "torch>=2.0",
    "realesrgan>=0.3.0",
    "basicsr>=1.4.2",
    "gfpgan>=1.3.8",
]
# `mysuite mcp`: the MCP server for Claude Desktop / Cursor / local-model clients.
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mysuite = "mysuite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mysuite"]

[tool.pytest.ini_options]
markers = [
    "slow: requires real rendering binaries (rsvg-convert/gs/magick)",
]
asyncio_mode = "auto"
